name: generate snake animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: jv8784815-ctrl
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232b0a3d&color_dots=%23ffd6e8,%23ffb3d9,%23ff8fc7,%23ff5cad,%23d6006d
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ffd6e8&color_dots=%232b0a3d,%234a1259,%237a1f6e,%23b32b8a,%23ff5cad

      - name: push snake svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
